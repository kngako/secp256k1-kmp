# gradle
org.gradle.jvmargs = -Xmx1536m
org.gradle.parallel = true

# kotlin
kotlin.code.style = official
kotlin.native.ignoreDisabledTargets = true
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.cacheKind.macosArm64=none

# Android
android.useAndroidX = true

# AGP 9 refuses com.android.library in a build that applies the Kotlin Multiplatform plugin, and
# replaces the kotlin("android") plugin with built-in Kotlin. These two flags keep the 8.x DSL and
# the separate Kotlin plugin working. Documented by AGP itself as the way to defer the migration to
# com.android.kotlin.multiplatform.library; revisit when that plugin can publish this artifact.
android.builtInKotlin=false
android.newDsl=false
